openapi: 3.1.0
info:
  title: HRIS Asia Raya — REST API v1
  version: 2.17.0
  description: |
    API untuk aplikasi Android karyawan PT Asia Raya Group.

    * Autentikasi memakai **bearer token** (opaque, dapat dicabut seketika).
      Token dibuat lewat `POST /api/v1/auth/login`; access token berlaku 8 jam dan
      refresh token 30 hari (dirotasi setiap kali dipakai).
    * Semua balasan JSON memakai amplop `{success, data, meta}` — atau
      `{success, code, message, errors, meta}` saat gagal.
    * Setiap respons membawa header `X-Request-Id`; kirim `X-Request-Id` sendiri
      bila ingin memakai ID yang sama di log aplikasi.
    * Presensi mendukung `Idempotency-Key` agar retry saat jaringan buruk tidak
      membuat dua baris presensi.
    * Unduhan PDF dapat memakai bearer token **atau** URL bertanda tangan
      (`employee`, `expires`, `signature`, berlaku 5 menit) untuk DownloadManager.
  servers:
    - url: https://hris.asiaraya.co.id
      description: Produksi
    - url: http://localhost:8080
      description: Pratinjau lokal (php-wasm + SQLite)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Konfigurasi
  - name: Pengumuman
  - name: Jadwal
  - name: Presensi
  - name: Lembur
  - name: Cuti
  - name: Slip Gaji
  - name: Klaim
  - name: Pajak
  - name: Notifikasi
  - name: Persetujuan

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Masuk dan dapatkan token perangkat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email, NIK, atau username }
                password: { type: string, format: password }
                device_name: { type: string, examples: [Pixel 8] }
                platform: { type: string, examples: [android] }
                app_version: { type: string, examples: [1.0.0] }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens: { $ref: '#/components/schemas/TokenPair' }
                          employee: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token menjadi pasangan token baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token baru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token perangkat ini
      responses:
        '200': { $ref: '#/components/responses/SimpleOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Profil karyawan + ringkasan beranda
      responses:
        '200':
          description: Profil & penghitung
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          employee: { $ref: '#/components/schemas/Employee' }
                          counters:
                            type: object
                            properties:
                              notifications_unread: { type: integer }
                              announcements_unread: { type: integer }
                              approvals_pending: { type: integer }
                              leave_open: { type: integer }
                              overtime_open: { type: integer }
                              claims_open: { type: integer }
                          attendance_today: { $ref: '#/components/schemas/AttendanceToday' }
                          permissions:
                            type: object
                            properties:
                              can_approve: { type: boolean }
                              role: { type: string, enum: [HR, FIN, KARYAWAN] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/app/config:
    get:
      tags: [Konfigurasi]
      summary: Konfigurasi & kebijakan untuk aplikasi (wajib dipanggil saat start)
      responses:
        '200':
          description: Konfigurasi aplikasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          app:
                            type: object
                            properties:
                              name: { type: string }
                              version: { type: string }
                              server_time: { type: string, format: date-time }
                              timezone: { type: string }
                              min_android_version: { type: string }
                          company: { $ref: '#/components/schemas/Company' }
                          employee: { $ref: '#/components/schemas/Employee' }
                          features:
                            type: object
                            additionalProperties: { type: boolean }
                          attendance:
                            type: object
                            properties:
                              work_start: { type: string, examples: ['08:00'] }
                              work_end: { type: string, examples: ['17:00'] }
                              late_tolerance: { type: integer }
                              geofence_required: { type: boolean }
                              selfie_required: { type: boolean }
                              wfh_bypass: { type: boolean }
                              photo_max_width: { type: integer }
                              photo_quality: { type: integer }
                              punch_radius_m: { type: integer }
                              unit:
                                type: object
                                properties:
                                  name: { type: string }
                                  lat: { type: number, nullable: true }
                                  lng: { type: number, nullable: true }
                          leave:
                            type: object
                            properties:
                              default_quota: { type: number }
                              allow_negative: { type: boolean }
                              max_range_days: { type: integer }
                              types:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    code: { type: string }
                                    name: { type: string }
                                    quota_days: { type: number }
                                    requires_attachment: { type: boolean }
                                    max_per_request: { type: integer }
                                    min_notice_days: { type: integer }
                          overtime:
                            type: object
                            properties:
                              enabled: { type: boolean }
                              divisor: { type: number }
                              first: { type: number }
                              next: { type: number }
                              holiday: { type: number }
                              max_hours: { type: number }
                              min_minutes: { type: integer }
                          claims:
                            type: object
                            properties:
                              max_age_days: { type: integer }
                          limits:
                            type: object
                            properties:
                              upload_max_mb: { type: integer }
                              photo_max_mb: { type: integer }
                              per_page_default: { type: integer }
                              per_page_max: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/announcements:
    get:
      tags: [Pengumuman]
      summary: Daftar pengumuman sesuai audiens karyawan
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Daftar pengumuman
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Announcement' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              unread_count: { type: integer }
                              pagination: { $ref: '#/components/schemas/Pagination' }

  /api/v1/announcements/{id}:
    get:
      tags: [Pengumuman]
      summary: Detail pengumuman (isi lengkap)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Announcement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/announcements/{id}/read:
    post:
      tags: [Pengumuman]
      summary: Tandai pengumuman sudah dibaca
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/SimpleOk' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/schedule/today:
    get:
      tags: [Jadwal]
      summary: Shift hari ini + 7 hari ke depan
      responses:
        '200':
          description: Jadwal hari ini
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          date: { type: string, format: date }
                          shift: { $ref: '#/components/schemas/Shift' }
                          next_days:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, format: date }
                                weekend: { type: boolean }
                                is_work: { type: boolean }
                                shift: { $ref: '#/components/schemas/Shift' }

  /api/v1/schedule:
    get:
      tags: [Jadwal]
      summary: Kalender jadwal pada rentang tanggal
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Daftar hari
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            dow: { type: integer }
                            weekend: { type: boolean }
                            is_work: { type: boolean }
                            shift: { $ref: '#/components/schemas/Shift' }

  /api/v1/shifts:
    get:
      tags: [Jadwal]
      summary: Daftar shift aktif
      responses:
        '200':
          description: Daftar shift
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Shift' }

  /api/v1/schedule-requests:
    get:
      tags: [Jadwal]
      summary: Riwayat pengajuan perubahan jadwal
      responses:
        '200':
          description: Daftar pengajuan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ScheduleRequest' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              has_open_request: { type: boolean }
    post:
      tags: [Jadwal]
      summary: Ajukan perubahan jadwal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_shift_id, start_date, end_date]
              properties:
                requested_shift_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Pengajuan dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request: { $ref: '#/components/schemas/ScheduleRequest' }
                          message: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/schedule-requests/{id}/cancel:
    post:
      tags: [Jadwal]
      summary: Batalkan pengajuan perubahan jadwal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/SimpleOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/attendance/today:
    get:
      tags: [Presensi]
      summary: Status presensi hari ini + pengaturan geofence
      responses:
        '200':
          description: Status hari ini
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceToday' }

  /api/v1/attendance/punch:
    post:
      tags: [Presensi]
      summary: Presensi masuk/keluar (geofence + selfie)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 80 }
          description: Kunci unik per percobaan presensi; kirim ulang kunci yang sama saat retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, lat, lng]
              properties:
                type: { type: string, enum: [in, out] }
                lat: { type: number, examples: [-6.2241] }
                lng: { type: number, examples: [106.8089] }
                accuracy: { type: number, description: Akurasi GPS (meter) }
                photo: { type: string, description: Data URL selfie `data:image/jpeg;base64,...` }
                note: { type: string, maxLength: 255 }
                device: { type: string, examples: [Pixel 8 / Android 15] }
                captured_at: { type: string, format: date-time, description: Waktu pengambilan di perangkat (mode offline) }
                offline: { type: boolean }
          multipart/form-data:
            schema:
              type: object
              properties:
                type: { type: string, enum: [in, out] }
                lat: { type: number }
                lng: { type: number }
                accuracy: { type: number }
                photo: { type: string, format: binary }
                note: { type: string }
      responses:
        '200':
          description: Presensi tercatat (atau hasil idempotent replay)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          punch:
                            type: object
                            properties:
                              type: { type: string, enum: [in, out] }
                              status: { type: string, nullable: true }
                              late_minutes: { type: integer }
                              work_minutes: { type: integer }
                              distance: { type: number, nullable: true }
                              geofence: { type: string }
                              at: { type: string, format: date-time }
                          attendance: { $ref: '#/components/schemas/AttendanceRecord' }
                          today: { $ref: '#/components/schemas/AttendanceToday' }
                          message: { type: string }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              idempotent_replay: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/attendance/history:
    get:
      tags: [Presensi]
      summary: Riwayat presensi satu bulan
      parameters:
        - { name: month, in: query, schema: { type: string, examples: [2026-10] } }
      responses:
        '200':
          description: Riwayat + total
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              month: { type: string }
                              totals: { type: object }

  /api/v1/attendance/summary:
    get:
      tags: [Presensi]
      summary: Rekap kehadiran bulan berjalan (hadir, terlambat, absen, jam kerja)
      parameters:
        - { name: month, in: query, schema: { type: string, examples: [2026-10] } }
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          month: { type: string }
                          present: { type: integer }
                          late: { type: integer }
                          absent: { type: integer }
                          late_minutes: { type: integer }
                          work_hours: { type: number }

  /api/v1/overtimes:
    get:
      tags: [Lembur]
      summary: Riwayat pengajuan lembur
      parameters:
        - { name: month, in: query, schema: { type: string, examples: [2026-10] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, MANAGER_APPROVED, APPROVED, REJECTED, CANCELLED, OPEN, ALL] } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar lembur
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Overtime' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              summary: { type: object }
                              policy: { type: object }
    post:
      tags: [Lembur]
      summary: Ajukan lembur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_date, planned_start, planned_end]
              properties:
                work_date: { type: string, format: date }
                planned_start: { type: string, examples: ['18:00'] }
                planned_end: { type: string, examples: ['20:00'] }
                reason: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Pengajuan dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          overtime: { $ref: '#/components/schemas/Overtime' }
                          message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/overtimes/policy:
    get:
      tags: [Lembur]
      summary: Kebijakan lembur + simulasi tarif per jam
      responses:
        '200':
          description: Kebijakan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          policy: { type: object }
                          preview: { type: object }
                          rate: { type: object }

  /api/v1/overtimes/{id}/cancel:
    post:
      tags: [Lembur]
      summary: Batalkan pengajuan lembur (selama belum disetujui final)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/SimpleOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/leave/types:
    get:
      tags: [Cuti]
      summary: Jenis cuti aktif + kebijakan
      responses:
        '200':
          description: Jenis cuti
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveType' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              policy: { type: object }

  /api/v1/leave/balances:
    get:
      tags: [Cuti]
      summary: Saldo cuti per jenis untuk satu tahun
      parameters:
        - { name: year, in: query, schema: { type: integer, examples: [2026] } }
      responses:
        '200':
          description: Saldo cuti
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            leave_type_id: { type: integer }
                            type_name: { type: string }
                            type_code: { type: string }
                            year: { type: integer }
                            quota: { type: number }
                            carry_over: { type: number }
                            used: { type: number }
                            remaining: { type: number }
                            unlimited: { type: boolean }
                            progress: { type: number }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              year: { type: integer }
                              summary: { type: object }

  /api/v1/leaves:
    get:
      tags: [Cuti]
      summary: Riwayat pengajuan cuti
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar cuti
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Leave' }
    post:
      tags: [Cuti]
      summary: Ajukan cuti
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type_id, start_date, reason]
              properties:
                leave_type_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, maxLength: 255 }
                attachment: { type: string, description: Data URL `data:application/pdf;base64,...` atau `data:image/jpeg;base64,...` }
          multipart/form-data:
            schema:
              type: object
              properties:
                leave_type_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string }
                attachment: { type: string, format: binary }
      responses:
        '201':
          description: Pengajuan dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          leave: { $ref: '#/components/schemas/Leave' }
                          warnings: { type: array, items: { type: string } }
                          message: { type: string }
