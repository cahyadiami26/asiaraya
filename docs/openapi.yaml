  /api/v1/approvals:
    get:
      tags: [Persetujuan]
      summary: Kotak masuk persetujuan (atasan langsung / HR / Finance)
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [all, leave, overtime, schedule, claim] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pengajuan menunggu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApprovalItem' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/Meta'
                          - type: object
                            properties:
                              counts: { type: object }
                              pagination: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/approvals/summary:
    get:
      tags: [Persetujuan]
      summary: Jumlah pengajuan menunggu per jenis
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          counts: { type: object }
                          total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/approvals/{type}/{id}/decide:
    post:
      tags: [Persetujuan]
      summary: Setujui atau tolak pengajuan
      description: |
        Tahap 1 dilakukan atasan langsung (`direct_manager_id`) → status
        `MANAGER_APPROVED`. Tahap 2 dilakukan HR → `APPROVED` final.
        Klaim dapat diputus HR **atau** Finance. Penolakan di tahap mana pun
        mengakhiri pengajuan sebagai `REJECTED`.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [leave, overtime, schedule, claim] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          type: { type: string }
                          status: { type: string }
                          stage: { type: string, enum: [MANAGER, HR, FINAL] }
                          message: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Token tidak ada / kedaluwarsa / dicabut
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Peran pengguna tidak berhak
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan / bukan milik pengguna
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Status data tidak memungkinkan aksi tersebut
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Payload tidak valid atau ditolak aturan bisnis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Terlalu banyak percobaan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SimpleOk:
      description: Berhasil
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        code:
          type: string
          examples: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, PUNCH_REJECTED]
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    Meta:
      type: object
      properties:
        request_id: { type: string, examples: [req_511f69d7a558377c] }
        server_time: { type: string, format: date-time }
        version: { type: string, examples: [2.17.0] }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
        has_more: { type: boolean }
    TokenPair:
      type: object
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        expires_in: { type: integer, description: Detik }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
    Company:
      type: object
      properties:
        name: { type: string }
        legal: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        logo_url: { type: string, nullable: true }
    Employee:
      type: object
      properties:
        id: { type: integer }
        employee_code: { type: string, examples: [ARG-JKT-0421] }
        full_name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [HR, FIN, KARYAWAN] }
        flag: { type: string, examples: [ACTIVE] }
        join_date: { type: string, format: date }
        position: { type: string, nullable: true }
        department: { type: string, nullable: true }
        business_unit: { type: string, nullable: true }
        manager:
          type: object
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
    Shift:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        start_time: { type: string, examples: ['08:00'] }
        end_time: { type: string, examples: ['17:00'] }
        break_minutes: { type: integer }
        late_tolerance: { type: integer }
        operational_type: { type: string, enum: [NORMAL, WFH, FIELD, SHIFT] }
    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        status: { type: string, enum: [PRESENT, LATE, ABSENT, LEAVE, WFH, OFF] }
        checked_in: { type: boolean }
        checked_out: { type: boolean }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }
        check_in_status: { type: string, nullable: true }
        late_minutes: { type: integer }
        early_leave_minutes: { type: integer }
        work_minutes: { type: integer }
        work_hours: { type: number }
        check_in_photo_url: { type: string, nullable: true }
        check_in_distance: { type: integer, nullable: true }
        note: { type: string, nullable: true }
        source: { type: string, examples: [ANDROID] }
    AttendanceToday:
      type: object
      properties:
        date: { type: string, format: date }
        shift: { $ref: '#/components/schemas/Shift' }
        shift_start: { type: string }
        shift_end: { type: string }
        late_tolerance: { type: integer }
        operational_type: { type: string }
        can_check_in: { type: boolean }
        can_check_out: { type: boolean }
        attendance: { $ref: '#/components/schemas/AttendanceRecord' }
        geofence:
          type: object
          properties:
            required: { type: boolean }
            selfie_required: { type: boolean }
            unit: { type: string }
            lat: { type: number }
            lng: { type: number }
            radius: { type: integer }
    Announcement:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        audience: { type: string }
        is_pinned: { type: boolean }
        author: { type: string, nullable: true }
        excerpt: { type: string }
        body: { type: string, description: Hanya pada endpoint detail }
        published_at: { type: string, format: date-time }
        attachment_url: { type: string, nullable: true }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
    ScheduleRequest:
      type: object
      properties:
        id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, MANAGER_APPROVED, APPROVED, REJECTED, CANCELLED] }
        status_label: { type: string }
        current_shift:
          type: object
          properties:
            id: { type: integer, nullable: true }
            code: { type: string, nullable: true }
            name: { type: string, nullable: true }
        requested_shift:
          type: object
          properties:
            id: { type: integer }
            code: { type: string, nullable: true }
            name: { type: string, nullable: true }
            start_time: { type: string, nullable: true }
            end_time: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Decision:
      type: object
      properties:
        manager:
          type: object
          properties:
            name: { type: string, nullable: true }
            at: { type: string, format: date-time, nullable: true }
            note: { type: string, nullable: true }
        hr:
          type: object
          properties:
            name: { type: string, nullable: true }
            at: { type: string, format: date-time, nullable: true }
            note: { type: string, nullable: true }
    Leave:
      type: object
      properties:
        id: { type: integer }
        request_number: { type: string, nullable: true }
        type:
          type: object
          properties:
            id: { type: integer }
            name: { type: string, nullable: true }
            code: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        days: { type: number }
        reason: { type: string, nullable: true }
        status: { type: string }
        status_label: { type: string }
        attachment_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        decision: { $ref: '#/components/schemas/Decision' }
    LeaveType:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        quota_days: { type: number }
        is_paid: { type: boolean }
        deduct_salary: { type: boolean }
        requires_attachment: { type: boolean }
        max_per_request: { type: integer }
        min_notice_days: { type: integer }
        color: { type: string, nullable: true }
    Overtime:
      type: object
      properties:
        id: { type: integer }
        work_date: { type: string, format: date }
        planned_start: { type: string }
        planned_end: { type: string }
        planned_hours: { type: number }
        actual_hours: { type: number, nullable: true }
        type: { type: string, enum: [REQUEST, SCHEDULED] }
        reason: { type: string, nullable: true }
        status: { type: string }
        status_label: { type: string }
        compensation_amount: { type: number }
        created_at: { type: string, format: date-time }
        decision: { $ref: '#/components/schemas/Decision' }
    Payslip:
      type: object
      properties:
        id: { type: integer }
        slip_number: { type: string }
        period:
          type: object
          properties:
            year: { type: integer }
            month: { type: integer }
            label: { type: string, examples: ['Oktober 2026'] }
            pay_date: { type: string, format: date, nullable: true }
            status: { type: string, enum: [FINANCE_APPROVED, PAID] }
        business_unit: { type: string, nullable: true }
        gross_salary: { type: number }
        total_deduction: { type: number }
        pph_amount: { type: number }
        net_salary: { type: number }
        take_home_pay: { type: number }
